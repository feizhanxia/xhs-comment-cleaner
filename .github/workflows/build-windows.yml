name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 11 compatible EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile-check Python source
        run: python -m compileall -q app tests

      - name: Build windowed onefile EXE
        run: python -m PyInstaller --noconfirm --clean XHSCommentCleaner.spec

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath ".\dist\XHSCommentCleaner.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\XHSCommentCleaner.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  XHSCommentCleaner.exe" | Set-Content -Encoding ascii ".\dist\XHSCommentCleaner.exe.sha256"
          Get-Item ".\dist\XHSCommentCleaner.exe" | Format-List Name,Length,LastWriteTime
          Get-Content ".\dist\XHSCommentCleaner.exe.sha256"

      - name: Upload downloadable EXE
        uses: actions/upload-artifact@v7.0.1
        with:
          name: XHSCommentCleaner-Windows-x64
          path: |
            dist/XHSCommentCleaner.exe
            dist/XHSCommentCleaner.exe.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\dist\XHSCommentCleaner.exe#XHSCommentCleaner.exe" `
            ".\dist\XHSCommentCleaner.exe.sha256#XHSCommentCleaner.exe.sha256" `
            --title "XHS Comment Cleaner $env:GITHUB_REF_NAME" `
            --generate-notes
